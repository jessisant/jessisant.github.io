<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1F1A22;--paper:#2A232E;--ink:#F3E9EF;--soft:#B9A9BF;--mauve:#D9A3AD;--leaf:#9CC0A1;--line:#3C3341;--chip:#352C3A}}

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:30rem;margin:0 auto;padding:2.5rem 1.25rem 3rem;position:relative}

.admin .tools{display:flex}
.tools button,.bar button,dialog button{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:.35rem .8rem;border-radius:999px;cursor:pointer}

.more summary{font-size:.9rem;margin-bottom:.75rem}
.jumps{display:grid;gap:.6rem;margin:-1.5rem 0 2.25rem}
.totop{position:fixed;right:1rem;bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));width:3rem;height:3rem;border-radius:50%;border:none;background:var(--mauve);color:#fff;font-size:1.4rem;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(46,36,51,.25);opacity:0;pointer-events:none;transform:translateY(.5rem);transition:opacity .2s,transform .2s;z-index:5}

.jump{display:block;width:100%;font:inherit;font-size:1rem;margin:0;padding:.95rem 1.1rem;border-radius:999px;border:1.5px solid var(--mauve);background:transparent;color:var(--ink);cursor:pointer}
.jump:hover{background:var(--chip)}
.jump[hidden]{display:none}
.camp.otros{border-left-color:var(--soft)}
.tools .del{color:#B44A5A}
details{margin-top:2rem}
summary{cursor:pointer;color:var(--soft)}
.empty{color:var(--soft);padding:1rem 0}
footer{margin-top:2.5rem;text-align:center;font-size:.85rem;color:var(--soft)}
footer a{color:var(--ink)}
.bar{display:none;position:sticky;bottom:0;margin:2rem -1.25rem -3rem;padding:.8rem 1.25rem calc(.8rem + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:2px solid var(--mauve);gap:.5rem;flex-wrap:wrap;align-items:center}
.admin .bar{display:flex}
.bar span{font-size:.85rem;color:var(--soft);flex-basis:100%}
.bar button.add{background:var(--mauve);border-color:var(--mauve);color:#fff}
.status{font-size:.85rem;color:var(--mauve);flex-basis:100%}
dialog{border:none;border-radius:1.2rem;padding:1.25rem;width:min(28rem,calc(100% - 2rem));background:var(--paper);color:var(--ink);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(46,36,51,.45)}
dialog h2{margin-bottom:1rem}
label{display:block;font-size:.85rem;color:var(--soft);margin-bottom:.75rem}
input,select,textarea{display:block;width:100%;margin-top:.25rem;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:.6rem;padding:.55rem .7rem}
textarea{min-height:4rem;resize:vertical}
fieldset{border:1px solid var(--line);border-radius:.8rem;padding:.75rem;margin:0 0 .75rem}
.field{margin-bottom:.75rem}
.fh{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--soft)}
.sw{display:flex;align-items:center;gap:.35rem;margin:0;cursor:pointer}

.field>input{margin-top:.25rem}

</style>

<body>
<div class="wrap" id="wrap">
  <header>
    <div class="avatar" id="avatar"></div>
    <h1 id="titulo"></h1>
    <p class="tags" id="etiquetas"></p>
    <p class="contact" id="contacto"></p>
    <div class="code" id="codeBox"><span class="code-l"><span id="codeLabel"></span>: <strong id="codeVal"></strong></span><button type="button" id="btnCopy">Copiar</button></div>
    <p class="intro" id="intro"></p>
  </header>
  <nav class="main-links" id="botones"></nav>
  <div class="jumps">
    <button type="button" class="jump" id="btnJumpCamp">Ir a campañas abiertas</button>
    <button type="button" class="jump" id="btnJump">Ir a recomendaciones de productos</button>
  </div>
  <section id="secCamp">
    <h2>Campañas abiertas</h2>
    <div class="filters" role="group" aria-label="Filtrar por categoría">
      <button data-f="todas" aria-pressed="true">Todas</button>
      <button data-f="nuevas" aria-pressed="false" class="fnew">¡Nuevas!</button>
      <button data-f="skincare" aria-pressed="false">Skincare</button>
      <button data-f="haircare" aria-pressed="false">Haircare</button>
      <button data-f="maquillaje" aria-pressed="false">Maquillaje</button>
    </div>
    <div class="list" id="open"><p class="loading">Cargando campañas…</p></div>
  </section>
  <section id="secReco" class="reco-sec">
    <h2>Recomendaciones de productos</h2>
    <div class="filters rf" role="group" aria-label="Filtrar recomendaciones por categoría">
      <button data-rf="todas" aria-pressed="true">Todas</button>
      <button data-rf="skincare" aria-pressed="false">Skincare</button>
      <button data-rf="haircare" aria-pressed="false">Haircare</button>
      <button data-rf="maquillaje" aria-pressed="false">Maquillaje</button>
      <button data-rf="otros" aria-pressed="false">Otros</button>
    </div>
    <div class="rgrid" id="recos"><p class="loading empty">Cargando recomendaciones…</p></div>
  </section>
  <footer id="pie"></footer>
  <button type="button" class="totop" id="btnTop" aria-label="Volver arriba">↑</button>
</div>

<script>
/* ===== CONFIGURACIÓN DE TU PÁGINA (puedes editar estos textos) ===== */
const CONFIG = {
  "gaId": "G-CDJED80XWL",
  "campanasCSV": "https://docs.google.com/spreadsheets/d/e/2PACX-1vQzSJh6JGIqFgMG91B3JgyCTavIZA6v9jlj-L3owAoMctITj5nKtuBUm64D2Zfkz9avCm1ubfa3kRfk/pub?output=csv",
  "recomendacionesCSV": "https://docs.google.com/spreadsheets/d/e/2PACX-1vRuaNTmHD6yImYKz12cxUL57Ey9pEYZ865gaVN-TQ03L8oWQtGQsM0MabpJ_v_qUeB6IBiPOWN6-2V2/pub?output=csv",
  "titulo": "Jessi te ayuda",
  "etiquetas": "Beauty | Skincare💄🩵💌",
  "usuario": "@jessisant_",
  "correo": "jessisant.info@gmail.com",
  "codigoTexto": "Código de YesStyle",
  "codigo": "JESSISANT10",
  "intro": "Colaboraciones abiertas para campañas de skincare, makeup, haircare entre otros. Revisa qué piden, la fecha límite y postula.",
  "foto": "fotos/foto-perfil.jpg",
  "botones": [
    {
      "texto": "Regístrate como Influencer de YesStyle",
      "link": "https://www.yesstyle.com/es/influencers.html?rco=JESSISANT10&utm_term=JESSISANT10&utm_medium=Influencer&utm_source=dynamic&mcg=influencer"
    }
  ]
};
/* ================================================================== */

(function(){
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const safeUrl = u => /^https?:\/\//i.test(String(u||"").trim()) ? String(u).trim() : "#";
const evento = (nombre, datos) => { try{ if(window.gtag) gtag("event", nombre, datos||{}); }catch(_){} };
const quieto = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

/* --- Cabecera --- */
document.title = CONFIG.titulo;
$("titulo").textContent = CONFIG.titulo;
$("etiquetas").textContent = CONFIG.etiquetas || "";
$("intro").textContent = CONFIG.intro || "";
const av = $("avatar");
if(CONFIG.foto){ const im = new Image(); im.alt = "Foto de perfil";
  im.onerror = ()=>{ const alt = im.src.includes("/fotos/") ? CONFIG.foto.replace(/^fotos\//,"") : null;
    if(alt && !im.dataset.retry){ im.dataset.retry="1"; im.src = alt; } else { im.remove(); av.textContent="🌸"; } };
  im.src = CONFIG.foto; av.appendChild(im); } else av.textContent = "🌸";
const u = (CONFIG.usuario||"").trim().replace(/^@/,""), mail = (CONFIG.correo||"").trim();
$("contacto").innerHTML = (u ? `<a href="https://www.tiktok.com/@${encodeURIComponent(u)}" target="_blank" rel="noopener">@${esc(u)}</a>` : "") +
  (mail ? `<span>Correo: <a href="mailto:${esc(mail)}">${esc(mail)}</a></span>` : "");
$("codeBox").hidden = !(CONFIG.codigo||"").trim();
$("codeLabel").textContent = CONFIG.codigoTexto || "Código";
$("codeVal").textContent = CONFIG.codigo || "";
$("botones").innerHTML = (CONFIG.botones||[]).filter(b=>b.texto).map(b=>`<a href="${esc(safeUrl(b.link))}" target="_blank" rel="noopener" data-boton="${esc(b.texto)}">${esc(b.texto)}</a>`).join("");
$("pie").innerHTML = u ? `Diseñado por <a href="https://www.tiktok.com/@${encodeURIComponent(u)}" target="_blank" rel="noopener">@${esc(u)}</a>` : "";

/* --- Lector de CSV (Google Sheets) --- */
function parseCSV(t){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=""; }
    else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=""; }
    else if(c!=='\r') f+=c;
  }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  if(!rows.length) return [];
  const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
  const h = rows[0].map(norm);
  return rows.slice(1).filter(r=>r.some(x=>x.trim())).map(r=>{ const o={}; h.forEach((k,i)=>o[k]=(r[i]||"").trim()); return o; });
}
function aFecha(s){
  s=String(s||"").trim(); if(!s) return null; let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)) return new Date(+m[1],m[2]-1,+m[3]);
  if(m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/)) return new Date(+m[3],m[2]-1,+m[1]);
  return null;
}
async function cargar(url){
  if(!/^https:\/\/docs\.google\.com\//.test(url||"")) throw new Error("sin-link");
  const r = await fetch(url + (url.includes("?")?"&":"?") + "t=" + Date.now(), {cache:"no-store"});
  if(!r.ok) throw new Error("http");
  return parseCSV(await r.text());
}

/* --- Campañas --- */
const hoy = new Date(); hoy.setHours(0,0,0,0);
let CAMP = [], filtro = "todas";
const CATS = ["skincare","haircare","maquillaje","otros"];
const cat = s => { const c=String(s||"").toLowerCase().trim(); return CATS.includes(c)?c:"skincare"; };
const dias = c => c.sinFecha || !c.cierre ? Infinity : Math.round((c.cierre - hoy)/86400000);
const fmt = d => d.toLocaleDateString("es-PE",{day:"numeric",month:"short"});
const esNueva = c => c.agregada && c.agregada.getTime() === hoy.getTime();

function card(c, i){
  const d = dias(c);
  const due = d===Infinity ? "Sin fecha límite, solo espera el correo de la marca :)" : d===0 ? "Cierra hoy" : d===1 ? "Cierra mañana" : `Cierra en ${d} días (${fmt(c.cierre)})`;
  const tit = [c.marca, c.producto].filter(Boolean).map(esc).join(" · ");
  return `<article class="camp ${c.categoria}">
    ${tit ? `<h3>${tit}</h3>` : ""}${c.pide ? `<p>${esc(c.pide)}</p>` : ""}
    <div class="row"><span class="due ${d>=0&&d<=3?"soon":""}">${due}</span>
    <div class="acts"><a class="go" href="${esc(safeUrl(c.link))}" target="_blank" rel="noopener" data-postular="${i}">Postular</a>
    <button type="button" class="copylink" data-copylink="${i}">Copiar link</button></div></div>
    ${esNueva(c) ? `<span class="nuevo">¡Nuevo!</span>` : ""}
    <input class="linkbox" id="lb${i}" readonly hidden value="${esc(safeUrl(c.link))}" aria-label="Link para postular">
  </article>`;
}
function renderCamp(){
  const ab = CAMP.map((c,i)=>[c,i]).filter(([c])=>dias(c)>=0 && (filtro==="todas" || (filtro==="nuevas" ? esNueva(c) : c.categoria===filtro))).sort((a,b)=>dias(a[0])-dias(b[0]));
  $("open").innerHTML = ab.length ? ab.map(([c,i])=>card(c,i)).join("") :
    `<p class="empty">${filtro==="nuevas" ? "Todavía no hay campañas nuevas de hoy. Revisa más tarde, siempre se suman nuevas." : "No hay campañas abiertas en esta categoría por ahora. Vuelve pronto, siempre se suman nuevas."}</p>`;
}

/* --- Recomendaciones --- */
let RECO = [], rfiltro = "todas";
function recoCard(r, i){
  const tit = [r.marca, r.producto].filter(Boolean).map(esc).join(" · ");
  const foto = r.foto ? (/^https?:\/\//i.test(r.foto) ? r.foto : "fotos/" + r.foto.replace(/^fotos\//,"")) : "";
  return `<article class="reco ${r.categoria}">${foto ? `<img src="${esc(foto)}" alt="${esc(r.producto)}" loading="lazy" onerror="if(!this.dataset.retry&&this.src.indexOf('/fotos/')>-1){this.dataset.retry=1;this.src=this.src.split('/fotos/').pop();}else{this.remove();}">` : ""}<div class="rbody">
    ${tit ? `<h3>${tit}</h3>` : ""}${r.nota ? `<p>${esc(r.nota)}</p>` : ""}
    <a class="go" href="${esc(safeUrl(r.link))}" target="_blank" rel="noopener" data-verproducto="${i}">Ver producto</a>
  </div></article>`;
}
function renderRecos(){
  const vis = RECO.map((r,i)=>[r,i]).filter(([r])=>rfiltro==="todas"||r.categoria===rfiltro);
  $("secReco").hidden = !RECO.length; $("btnJump").hidden = !RECO.length;
  $("recos").innerHTML = vis.length ? [0,1].map(col=>`<div class="rcol">${vis.filter((_,k)=>k%2===col).map(([r,i])=>recoCard(r,i)).join("")}</div>`).join("") :
    `<p class="empty">No hay recomendaciones en esta categoría por ahora.</p>`;
}

/* --- Carga de datos --- */
cargar(CONFIG.campanasCSV).then(rows=>{
  CAMP = rows.map(r=>({
    marca:r["marca"], producto:r["producto"], pide:r["que piden"], categoria:cat(r["categoria"]),
    cierre:aFecha(r["fecha limite"]), sinFecha:/^s[ií]/i.test(r["sin fecha limite"]||""),
    agregada:aFecha(r["fecha agregada"]), link:r["link"]
  })).filter(c=>c.link || c.marca);
  renderCamp();
}).catch(()=>{ $("open").innerHTML = `<p class="empty">No se pudieron cargar las campañas en este momento. Vuelve a intentar en unos minutos.</p>`; });

cargar(CONFIG.recomendacionesCSV).then(rows=>{
  RECO = rows.map(r=>({ producto:r["producto"], marca:r["marca"], nota:r["por que lo recomiendas"], categoria:cat(r["categoria"]), link:r["link"], foto:r["foto"] })).filter(r=>r.link || r.producto);
  renderRecos();
}).catch(()=>{ RECO=[]; renderRecos(); });

/* --- Filtros --- */
document.querySelectorAll("[data-f]").forEach(b=>b.addEventListener("click",()=>{
  filtro=b.dataset.f; document.querySelectorAll("[data-f]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  renderCamp(); evento("filtro_campanas",{filtro});
}));
document.querySelectorAll("[data-rf]").forEach(b=>b.addEventListener("click",()=>{
  rfiltro=b.dataset.rf; document.querySelectorAll("[data-rf]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  renderRecos(); evento("filtro_recomendaciones",{filtro:rfiltro});
}));

/* --- Copiar --- */
async function copiarTexto(txt){
  try{ await navigator.clipboard.writeText(txt); return true; }catch(_){}
  const t=document.createElement("textarea"); t.value=txt; t.setAttribute("readonly",""); t.style.position="fixed"; t.style.opacity="0";
  document.body.appendChild(t); t.select(); let ok=false; try{ ok=document.execCommand("copy"); }catch(_){} t.remove(); return ok;
}
$("btnCopy").addEventListener("click", async ()=>{
  const b=$("btnCopy"), ok=await copiarTexto(CONFIG.codigo||"");
  if(!ok){ const r=document.createRange(); r.selectNodeContents($("codeVal")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
  b.textContent = ok ? "¡Copiado!" : "Mantén presionado para copiar";
  clearTimeout(b._t); b._t=setTimeout(()=>{ b.textContent="Copiar"; },2000);
  evento("copiar_codigo",{codigo:CONFIG.codigo});
});

/* --- Clics (métricas) y copiar link --- */
document.addEventListener("click", async e=>{
  const p=e.target.closest("[data-postular]");
  if(p){ const c=CAMP[+p.dataset.postular]; evento("postular",{campana:c ? (c.marca||c.producto||"sin nombre") : ""}); }
  const v=e.target.closest("[data-verproducto]");
  if(v){ const r=RECO[+v.dataset.verproducto]; evento("ver_producto",{producto:r ? r.producto : ""}); }
  const bt=e.target.closest("[data-boton]");
  if(bt) evento("clic_boton",{boton:bt.dataset.boton});
  const cl=e.target.closest("[data-copylink]");
  if(cl){
    const i=+cl.dataset.copylink, c=CAMP[i], ok=await copiarTexto(safeUrl(c && c.link));
    if(ok) cl.textContent="¡Link copiado!";
    else { const box=$("lb"+i); if(box){ box.hidden=false; box.focus(); box.select(); } cl.textContent="Mantén presionado el link para copiar"; }
    clearTimeout(cl._t); cl._t=setTimeout(()=>{ cl.textContent="Copiar link"; },2500);
    evento("copiar_link",{campana:c ? (c.marca||"") : ""});
  }
});

/* --- Navegación --- */
const irA = el => el.scrollIntoView({behavior: quieto() ? "auto" : "smooth", block:"start"});
$("btnJumpCamp").addEventListener("click",()=>irA($("secCamp")));
$("btnJump").addEventListener("click",()=>irA($("secReco")));
$("btnTop").addEventListener("click",()=>window.scrollTo({top:0, behavior: quieto() ? "auto" : "smooth"}));
const mostrarTop = ()=>$("btnTop").classList.toggle("show", window.scrollY > 400);
window.addEventListener("scroll", mostrarTop, {passive:true}); mostrarTop();
})();
</script>
</body>
